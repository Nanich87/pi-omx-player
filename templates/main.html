<!DOCTYPE html>
<html lang="bg" data-bs-theme="dark">

<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>TVPi</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   <style>
      body {
         padding-bottom: 2rem;
      }

      .remote {
         position: sticky;
         top: 0;
         z-index: 10;
         background: var(--bs-body-bg);
         border-bottom: 1px solid var(--bs-border-color);
      }

      .remote .btn {
         min-height: 3rem;
         font-size: 1.15rem;
      }

      .group-label {
         font-size: .75rem;
         text-transform: uppercase;
         letter-spacing: .06em;
         color: var(--bs-secondary-color);
         margin-bottom: .25rem;
      }

      .now-playing {
         min-width: 0;
      }

      .file-item {
         display: flex;
         align-items: center;
         gap: .75rem;
         padding: .9rem 1rem;
         font-size: 1.05rem;
      }

      .file-item .name {
         flex: 1;
         min-width: 0;
         overflow-wrap: anywhere;
      }

      .ctl.busy {
         opacity: .6;
         pointer-events: none;
      }
   </style>
</head>

<body>
   <div class="remote shadow-sm">
      <div class="container py-3">
         <div class="d-flex align-items-center gap-3 mb-3">
            <i class="bi bi-tv fs-3 text-primary"></i>
            <div class="now-playing flex-grow-1">
               <div class="group-label mb-0">{{ 'Сега върви' if current else 'TVPi' }}</div>
               <div class="fw-semibold text-truncate">{{ current if current else 'Нищо не върви' }}</div>
            </div>
            <a href="{{ url_for('stop') }}" class="btn btn-danger ctl{{ '' if current else ' disabled' }}" data-reload="1" title="Стоп">
               <i class="bi bi-stop-fill"></i><span class="d-none d-sm-inline ms-1">Стоп</span>
            </a>
         </div>

         <div class="row g-2">
            <div class="col-6 col-md-4">
               <div class="group-label">Звук</div>
               <div class="btn-group w-100">
                  <a href="{{ url_for('down') }}" class="btn btn-outline-light ctl" title="По-тихо"><i class="bi bi-volume-down-fill"></i></a>
                  <a href="{{ url_for('up') }}" class="btn btn-outline-light ctl" title="По-силно"><i class="bi bi-volume-up-fill"></i></a>
               </div>
            </div>
            <div class="col-6 col-md-4">
               <div class="group-label">Аудио</div>
               <div class="btn-group w-100">
                  <a href="{{ url_for('previousAudioStream') }}" class="btn btn-outline-info ctl" title="Предишна аудио писта"><i class="bi bi-chevron-left"></i></a>
                  <a href="{{ url_for('nextAudioStream') }}" class="btn btn-outline-info ctl" title="Следваща аудио писта"><i class="bi bi-chevron-right"></i></a>
               </div>
            </div>
            <div class="col-12 col-md-4">
               <div class="group-label">Субтитри</div>
               <div class="btn-group w-100">
                  <a href="{{ url_for('previousSubtitleStream') }}" class="btn btn-outline-warning ctl" title="Предишни субтитри"><i class="bi bi-chevron-left"></i></a>
                  <a href="{{ url_for('showSubtitles') }}" class="btn btn-outline-warning ctl" title="Покажи субтитрите"><i class="bi bi-badge-cc-fill"></i></a>
                  <a href="{{ url_for('hideSubtitles') }}" class="btn btn-outline-warning ctl" title="Скрий субтитрите"><i class="bi bi-badge-cc"></i></a>
                  <a href="{{ url_for('nextSubtitleStream') }}" class="btn btn-outline-warning ctl" title="Следващи субтитри"><i class="bi bi-chevron-right"></i></a>
               </div>
            </div>
         </div>
      </div>
   </div>

   <div class="container mt-3">
      <div class="input-group mb-3">
         <span class="input-group-text"><i class="bi bi-search"></i></span>
         <input type="search" id="filter" class="form-control form-control-lg" placeholder="Търси видео" autocomplete="off">
      </div>

      {% set files = list | sort %}
      {% if files %}
      <div class="list-group" id="files">
         {% for item in files %}
         <a href="{{ url_for('play', file=item) }}" class="list-group-item list-group-item-action file-item ctl{{ ' active' if item == current }}" data-reload="1" data-name="{{ item | lower }}">
            <i class="bi bi-film"></i>
            <span class="name">{{ item }}</span>
            <i class="bi {{ 'bi-volume-up-fill' if item == current else 'bi-play-circle' }} fs-4"></i>
         </a>
         {% endfor %}
      </div>
      <p id="no-match" class="text-secondary text-center mt-4 d-none">Няма видеа, които да съвпадат с търсенето.</p>
      {% else %}
      <p class="text-secondary text-center mt-5"><i class="bi bi-folder2-open fs-1 d-block mb-2"></i>Няма намерени видеа.</p>
      {% endif %}
   </div>

   <script>
      document.querySelectorAll('.ctl').forEach(function (el) {
         el.addEventListener('click', function (e) {
            e.preventDefault();
            el.classList.add('busy');
            fetch(el.href).then(function () {
               if (el.dataset.reload) {
                  location.reload();
               }
            }).finally(function () {
               el.classList.remove('busy');
            });
         });
      });

      var filter = document.getElementById('filter');
      filter.addEventListener('input', function () {
         var q = filter.value.trim().toLowerCase();
         var shown = 0;
         document.querySelectorAll('#files .file-item').forEach(function (el) {
            var match = el.dataset.name.indexOf(q) !== -1;
            el.classList.toggle('d-none', !match);
            if (match) {
               shown++;
            }
         });
         var none = document.getElementById('no-match');
         if (none) {
            none.classList.toggle('d-none', shown > 0);
         }
      });
   </script>
</body>

</html>
